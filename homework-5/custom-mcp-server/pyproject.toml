[project]
name = "lorem-ipsum-mcp"
version = "0.1.0"
description = "Custom FastMCP server exposing lorem-ipsum.md as a resource and a `read` tool (Homework 5)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
addopts = "-q"
