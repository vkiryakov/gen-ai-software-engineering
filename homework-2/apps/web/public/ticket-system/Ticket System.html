<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Triage — Ticket System</title>

<link rel="stylesheet" href="_ds/triage-design-system-a9a780a9-7c56-4382-83bd-c978a6eefa88/tokens/fonts.css">
<link rel="stylesheet" href="_ds/triage-design-system-a9a780a9-7c56-4382-83bd-c978a6eefa88/tokens/colors.css">
<link rel="stylesheet" href="_ds/triage-design-system-a9a780a9-7c56-4382-83bd-c978a6eefa88/tokens/typography.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/config.js"></script>

<script type="text/babel" data-presets="react" src="app/Sidebar.jsx"></script>
<script type="text/babel" data-presets="react" src="app/TicketList.jsx"></script>
<script type="text/babel" data-presets="react" src="app/TicketDetail.jsx"></script>
<script type="text/babel" data-presets="react" src="app/TicketFormModal.jsx"></script>
<script type="text/babel" data-presets="react" src="app/ImportModal.jsx"></script>

<style>
  html, body { margin: 0; height: 100%; background: var(--bg-app); font-family: var(--font-sans); }
  #root { height: 100%; }
  a { color: var(--text-link); }
  a:hover { color: var(--brand-700); }

  .triage-mobile-only { display: none; }
  .triage-sidebar-backdrop { display: none; }

  @media (max-width: 860px) {
    .triage-mobile-only { display: inline-flex !important; }
    .triage-sidebar {
      position: fixed; top: 0; left: 0; z-index: 60; height: 100vh !important;
      transform: translateX(-100%); transition: transform 0.2s cubic-bezier(0.2,0,0,1);
      box-shadow: var(--shadow-lg);
    }
    .triage-sidebar.is-open { transform: translateX(0); }
    .triage-sidebar-backdrop {
      display: block; position: fixed; inset: 0; background: color-mix(in oklch, var(--ink-950) 45%, transparent);
      z-index: 55;
    }
    .triage-list-pane, .triage-detail-pane { width: 100% !important; border-right: none !important; }
    .triage-filter-popover { width: 220px !important; right: 0 !important; }
    .triage-collapse-toggle { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { Button, Input, FieldLabel, Banner, Badge } = window.TriageDesignSystem_a9a780;
const { useState, useRef, useEffect } = React;

const MARK = (
  <span style={{ display: 'inline-flex', alignItems: 'flex-end', gap: 3, height: 26 }}>
    <span style={{ width: 5, borderRadius: 2, background: 'var(--brand-500)', height: 10 }}></span>
    <span style={{ width: 5, borderRadius: 2, background: 'var(--brand-500)', height: 16 }}></span>
    <span style={{ width: 5, borderRadius: 2, background: 'var(--brand-500)', height: 22 }}></span>
    <span style={{ width: 5, borderRadius: 2, background: 'var(--brand-500)', height: 28 }}></span>
  </span>
);

function Shell({ children }) {
  return (
    <div style={{ minHeight: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, boxSizing: 'border-box' }}>
      <div style={{ width: 380, maxWidth: '100%', display: 'flex', flexDirection: 'column', gap: 24 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10 }}>
          {MARK}
          <span style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 22, letterSpacing: '-0.02em', color: 'var(--ink-950)' }}>Triage</span>
        </div>
        <div style={{ background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-md)', padding: 32, boxSizing: 'border-box' }}>
          {children}
        </div>
      </div>
    </div>
  );
}

function LoginScreen({ onSubmit }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState(false);
  const [loading, setLoading] = useState(false);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (loading) return;
    // Demo rule: password exactly "wrong" triggers the error state.
    if (password.trim().toLowerCase() === 'wrong') {
      setError(true);
      return;
    }
    setError(false);
    setLoading(true);
    setTimeout(() => { setLoading(false); onSubmit(email); }, 500);
  };

  return (
    <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <div>
        <div style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 22, color: 'var(--ink-950)', letterSpacing: '-0.02em' }}>Вход в Triage</div>
        <div style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)', marginTop: 4 }}>Войдите, чтобы продолжить работу с очередью тикетов.</div>
      </div>

      {error && (
        <Banner tone="danger" title="Неверный email или пароль">
          Проверьте данные и попробуйте снова.
        </Banner>
      )}

      <FieldLabel label="Email">
        <Input type="email" required placeholder="you@company.com" value={email} invalid={error} onChange={(e) => setEmail(e.target.value)} autoFocus />
      </FieldLabel>

      <FieldLabel label="Пароль">
        <Input type="password" required placeholder="••••••••" value={password} invalid={error} onChange={(e) => setPassword(e.target.value)} />
      </FieldLabel>

      <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: -8 }}>
        <a href="#" style={{ fontSize: 'var(--text-sm)', textDecoration: 'none' }} onClick={(e) => e.preventDefault()}>Забыли пароль?</a>
      </div>

      <Button type="submit" variant="primary" size="lg" fullWidth disabled={loading}>
        {loading ? 'Проверка…' : 'Войти'}
      </Button>

      <div style={{ fontSize: 'var(--text-xs)', color: 'var(--text-tertiary)', textAlign: 'center' }}>
        Подсказка: введите пароль «wrong», чтобы увидеть ошибку — любой другой войдёт.
      </div>
    </form>
  );
}

function SuccessScreen() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16, textAlign: 'center', padding: '12px 0' }}>
      <div style={{ width: 48, height: 48, borderRadius: '50%', background: 'var(--success-bg)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <i data-lucide="check" style={{ width: 24, height: 24, color: 'var(--success)' }}></i>
      </div>
      <div>
        <div style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 20, color: 'var(--ink-950)' }}>Вход выполнен</div>
        <div style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)', marginTop: 4 }}>Открываем очередь тикетов…</div>
      </div>
    </div>
  );
}

function TopBar({ isMobile, onImport, onNewTicket, onLogout }) {
  const cfg = window.TriageConfig.get();
  return (
    <header style={{
      height: 'var(--topbar-h)', flex: '0 0 auto', display: 'flex', alignItems: 'center', gap: '10px',
      padding: '0 16px', background: 'var(--surface-card)', borderBottom: '1px solid var(--border-subtle)',
    }}>
      <div style={{ flex: 1 }} />
      {cfg.mock && (
        <span title="Using mock data — edit app/config.js to connect a real API">
          <Badge tone="warning" variant="outline">Mock data</Badge>
        </span>
      )}
      <Button variant="secondary" size="sm" iconLeft={<i data-lucide="upload" style={{ width: 15, height: 15 }}></i>} onClick={onImport}>{isMobile ? null : 'Import'}</Button>
      <Button size="sm" iconLeft={<i data-lucide="plus" style={{ width: 15, height: 15 }}></i>} onClick={onNewTicket}>{isMobile ? null : 'New ticket'}</Button>
      <div style={{ width: 1, height: 20, background: 'var(--border-subtle)', margin: '0 2px' }}></div>
      <button onClick={onLogout} title="Log out" style={{
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 30, height: 30,
        background: 'transparent', border: 'none', color: 'var(--text-secondary)', cursor: 'pointer', borderRadius: 'var(--radius-md)',
      }}>
        <i data-lucide="log-out" style={{ width: 17, height: 17 }}></i>
      </button>
    </header>
  );
}

function useIsMobile() {
  const [isMobile, setIsMobile] = useState(() => window.matchMedia('(max-width: 860px)').matches);
  useEffect(() => {
    const mq = window.matchMedia('(max-width: 860px)');
    const onChange = (e) => setIsMobile(e.matches);
    mq.addEventListener('change', onChange);
    return () => mq.removeEventListener('change', onChange);
  }, []);
  return isMobile;
}

function Toast({ toast }) {
  if (!toast) return null;
  const tones = {
    success: { bg: 'var(--ink-900)', color: '#fff' },
    danger: { bg: 'var(--danger)', color: '#fff' },
  };
  const t = tones[toast.type] || tones.success;
  return (
    <div style={{
      position: 'fixed', bottom: 20, left: '50%', transform: 'translateX(-50%)', zIndex: 1000,
      background: t.bg, color: t.color, padding: '10px 16px', borderRadius: 'var(--radius-md)',
      fontSize: 'var(--text-sm)', fontWeight: 500, boxShadow: 'var(--shadow-lg)', maxWidth: '90vw', textAlign: 'center',
    }}>{toast.message}</div>
  );
}

function AgentApp({ onLogout }) {
  const isMobile = useIsMobile();
  const [tickets, setTickets] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [activeQueue, setActiveQueue] = useState('all');
  const [activeId, setActiveId] = useState(null);
  const [tab, setTab] = useState('open');
  const [mobileView, setMobileView] = useState('list');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(() => localStorage.getItem('triage_sidebar_collapsed') === '1');
  const [importOpen, setImportOpen] = useState(false);
  const [formModal, setFormModal] = useState({ open: false, ticket: null });
  const [toast, setToast] = useState(null);

  const notify = (message, type = 'success') => setToast({ message, type });

  const refresh = React.useCallback(async () => {
    setLoading(true);
    setLoadError(null);
    try {
      const list = await window.TriageAPI.listTickets({});
      setTickets(list);
      setActiveId((cur) => (cur && list.some((t) => t.id === cur)) ? cur : (list[0] ? list[0].id : null));
    } catch (e) {
      setLoadError(e.message || 'Could not load tickets.');
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { refresh(); }, [refresh]);
  useEffect(() => { window.lucide && window.lucide.createIcons(); }, [tickets, activeId, importOpen, formModal, toast, sidebarOpen, isMobile]);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 3200);
    return () => clearTimeout(t);
  }, [toast]);

  const queueFiltered = (list) => {
    if (activeQueue === 'mine') return list.filter((t) => t.assigned_to === 'priya');
    if (activeQueue === 'unassigned') return list.filter((t) => !t.assigned_to);
    if (activeQueue === 'urgent') return list.filter((t) => t.priority === 'urgent');
    if (activeQueue === 'waiting_customer') return list.filter((t) => t.status === 'waiting_customer');
    if (activeQueue === 'resolved') return list.filter((t) => t.status === 'resolved');
    return list;
  };

  const visibleTickets = queueFiltered(tickets);
  const active = tickets.find((t) => t.id === activeId) || null;

  const counts = {
    all: tickets.length,
    mine: tickets.filter((t) => t.assigned_to === 'priya').length,
    unassigned: tickets.filter((t) => !t.assigned_to).length,
    urgent: tickets.filter((t) => t.priority === 'urgent').length,
    waiting_customer: tickets.filter((t) => t.status === 'waiting_customer').length,
    resolved: tickets.filter((t) => t.status === 'resolved').length,
  };

  const selectTicket = (id) => {
    setActiveId(id);
    if (isMobile) setMobileView('detail');
  };

  const updateTicket = async (id, patch) => {
    try {
      const saved = await window.TriageAPI.updateTicket(id, patch);
      setTickets((list) => list.map((t) => (t.id === id ? saved : t)));
      notify('Ticket updated.');
    } catch (e) {
      notify(e.message || 'Could not update ticket.', 'danger');
    }
  };

  const deleteTicket = async (id) => {
    const ticket = tickets.find((t) => t.id === id);
    try {
      await window.TriageAPI.deleteTicket(id);
      setTickets((list) => {
        const next = list.filter((t) => t.id !== id);
        setActiveId((cur) => (cur === id ? (next[0] ? next[0].id : null) : cur));
        return next;
      });
      if (isMobile) setMobileView('list');
      notify(`Deleted ticket #${ticket ? ticket.number : ''}.`);
    } catch (e) {
      notify(e.message || 'Could not delete ticket.', 'danger');
    }
  };

  const onTicketSaved = (saved, isEdit) => {
    setTickets((list) => (isEdit ? list.map((t) => (t.id === saved.id ? saved : t)) : [saved, ...list]));
    setActiveId(saved.id);
    setActiveQueue('all');
    setFormModal({ open: false, ticket: null });
    if (isMobile) setMobileView('detail');
    notify(isEdit ? `Ticket #${saved.number} updated.` : `Ticket #${saved.number} created.`);
  };

  const onImported = (result) => {
    setImportOpen(false);
    refresh();
    setActiveQueue('all');
    if (result.failed_count) {
      notify(`Imported ${result.imported_count}, ${result.failed_count} row(s) failed — check the file and retry those rows.`, 'danger');
    } else {
      notify(`Import complete — ${result.imported_count} tickets added.`);
    }
  };

  const toggleSidebarCollapsed = () => {
    setSidebarCollapsed((v) => {
      const next = !v;
      try { localStorage.setItem('triage_sidebar_collapsed', next ? '1' : '0'); } catch {}
      return next;
    });
  };

  const listPane = (
    <window.TicketList
      tickets={visibleTickets} loading={loading} activeId={activeId} onSelect={selectTicket}
      tab={tab} onTab={setTab} onOpenMenu={() => setSidebarOpen(true)}
    />
  );
  const detailPane = (
    <window.TicketDetail
      t={active} key={active ? active.id : 'empty'} onUpdate={updateTicket} onDelete={deleteTicket}
      onEdit={(t) => setFormModal({ open: true, ticket: t })}
      showBack={isMobile} onBack={() => setMobileView('list')}
    />
  );

  return (
    <div style={{ display: 'flex', height: '100vh', width: '100vw', background: 'var(--bg-app)', overflow: 'hidden' }}>
      <window.Sidebar activeQueue={activeQueue} onSelectQueue={setActiveQueue} counts={counts}
        mobileOpen={isMobile && sidebarOpen} onCloseMobile={() => setSidebarOpen(false)}
        collapsed={!isMobile && sidebarCollapsed} onToggleCollapse={toggleSidebarCollapsed} />
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
        <TopBar isMobile={isMobile} onImport={() => setImportOpen(true)}
          onNewTicket={() => setFormModal({ open: true, ticket: null })} onLogout={onLogout} />
        {loadError && (
          <div style={{ padding: '10px 16px' }}>
            <Banner tone="danger" title="Couldn't load tickets" onClose={refresh}>{loadError} — <a href="#" onClick={(e) => { e.preventDefault(); refresh(); }}>retry</a></Banner>
          </div>
        )}
        <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
          {isMobile ? (mobileView === 'list' ? listPane : detailPane) : (<React.Fragment>{listPane}{detailPane}</React.Fragment>)}
        </div>
      </div>
      <window.ImportModal open={importOpen} onClose={() => setImportOpen(false)} onImported={onImported} />
      <window.TicketFormModal open={formModal.open} ticket={formModal.ticket} onClose={() => setFormModal({ open: false, ticket: null })} onSaved={onTicketSaved} />
      <Toast toast={toast} />
    </div>
  );
}

function App() {
  const [step, setStep] = useState('login');

  useEffect(() => { window.lucide && window.lucide.createIcons(); }, [step]);
  useEffect(() => {
    if (step !== 'done') return;
    const t = setTimeout(() => setStep('app'), 900);
    return () => clearTimeout(t);
  }, [step]);

  if (step === 'app') {
    return <AgentApp onLogout={() => setStep('login')} />;
  }

  return (
    <Shell>
      {step === 'login' && <LoginScreen onSubmit={() => setStep('done')} />}
      {step === 'done' && <SuccessScreen />}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
